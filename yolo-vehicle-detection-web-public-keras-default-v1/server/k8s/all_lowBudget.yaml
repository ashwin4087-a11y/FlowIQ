apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: express-app
  template:
    metadata:
      labels:
        app: express-app
    spec:
      containers:
        - name: express-app
          image: alivefordie/express-server:v1.3
          imagePullPolicy: Always
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: express-env
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: express-env
                  key: SECRET_KEY
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: express-config
                  key: PORT
            - name: URL
              valueFrom:
                configMapKeyRef:
                  name: express-config
                  key: URL
            - name: FRONT_URL
              valueFrom:
                configMapKeyRef:
                  name: express-config
                  key: FRONT_URL
            - name: FRONT_PORT
              valueFrom:
                configMapKeyRef:
                  name: express-config
                  key: FRONT_PORT
---
apiVersion: v1
kind: Service
metadata:
  name: express-prisma-service
spec:
  selector:
    app: express-app
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: express-config
data:
  PORT: "3001"
  URL: ""
  FRONT_URL: ""
  FRONT_PORT: ""
---
